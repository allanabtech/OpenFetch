name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build-tauri:
    name: Build — ${{ matrix.settings.os_name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            os_name: macOS

          - platform: 'ubuntu-22.04'
            args: ''
            os_name: Linux

          - platform: 'windows-latest'
            args: ''
            os_name: Windows

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.tag.outputs.TAG }}
          releaseName: 'OpenFetch ${{ steps.tag.outputs.TAG }}'
          releaseBody: |
            ## OpenFetch ${{ steps.tag.outputs.TAG }}

            > The last download manager you'll ever need.

            ### 🚀 What's New
            - Plugin-based download architecture (generic-http, GitHub Releases)
            - Chunked, resumable downloads with SHA-256 verification
            - Beautiful glassmorphism UI with 9 pages
            - SQLite-backed download history and queue
            - Cross-platform: Windows, macOS, Linux

            ### 📦 Platform Downloads

            | Platform | Installer |
            |----------|-----------|
            | 🪟 Windows | `.msi` (recommended) or `.exe` setup |
            | 🍎 macOS | `.dmg` (Universal — Apple Silicon + Intel) |
            | 🐧 Linux | `.AppImage` (portable) or `.deb` (Debian/Ubuntu) |

            ### 🔌 Plugin System
            OpenFetch ships with `generic-http` and `github-releases` plugins.
            Build your own: see [Plugin SDK docs](https://github.com/allanabtech/OpenFetch/tree/main/packages/plugin-sdk)

            ---
            MIT Licensed · [GitHub](https://github.com/allanabtech/OpenFetch) · [Report Issue](https://github.com/allanabtech/OpenFetch/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.args }}
